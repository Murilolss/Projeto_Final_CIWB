<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens | Breaking Bad</title>
    <link rel="icon" type="image/svg+xml" href="../../img/favicon.svg">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- CSS global -->
    <link rel="stylesheet" href="../../global.css">

    <!-- Componentes -->
    <link rel="stylesheet" href="../../components/Header/header.css">
    <link rel="stylesheet" href="../../components/Navbar/navbar.css">
    <link rel="stylesheet" href="../../components/Footer/footer.css">
    <link rel="stylesheet" href="../../components/Card/card.css">
    <link rel="stylesheet" href="../../components/Aviso/aviso.css">
    <link rel="stylesheet" href="../../components/Modal/modal.css">

    <!-- CSS Pagina Personagens -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Preenchidos pelos componentes (T-11) -->
    <header id="cabecalho"></header>
    <nav id="menu"></nav>

    <main class="container py-4">
        <h1>Personagens</h1>

        <!-- Busca por nome (RF06). O label ligado ao campo pelo for/id (RNF02) -->
        <div class="busca mb-4">
            <label for="busca" class="form-label">Buscar personagem</label>
            <input type="search" id="busca" class="form-control" placeholder="Ex.: Walter White" autocomplete="off">
            <!-- Total da busca (T-28). role="status": o leitor de tela anuncia sem interromper -->
            <p id="total-busca" class="form-text" role="status"></p>
        </div>

        <!-- "Carregando...", erro ou "Nenhum item encontrado" (componente Aviso) -->
        <div id="aviso"></div>

        <!-- Um card por personagem (componente Card). O modal é criado pelo componente Modal -->
        <div id="lista"></div>
    </main>

    <footer id="rodape"></footer>

    <!-- Scripts no fim do body, nesta ordem: cada arquivo usa funções dos anteriores -->
    <!-- 1. Bootstrap (navbar que recolhe e modal) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 2. Services -->
    <script src="../../services/config.js"></script>
    <script src="../../services/api.js"></script>
    <script src="../../services/cache.js"></script>
    <script src="../../services/busca.js"></script>
    <script src="../../services/datas.js"></script>
    <!-- 3. Componentes -->
    <script src="../../components/Header/header.js"></script>
    <script src="../../components/Navbar/navbar.js"></script>
    <script src="../../components/Footer/footer.js"></script>
    <script src="../../components/Card/card.js"></script>
    <script src="../../components/Aviso/aviso.js"></script>
    <script src="../../components/Modal/modal.js"></script>
    <!-- 4. Script desta página -->
    <script src="script.js"></script>
</body>

</html>
